name: image

# Reusable: build the repository's Dockerfile, optionally smoke-test it, push it to
# ghcr.io/<owner>/<repo> (lowercase) and attest it. Outputs the pushed digest for deploy.yml.
#
#   Ref                      Tags pushed
#   develop                  :develop        :sha-<short>
#   master | main            :master / :main :sha-<short>
#   tag X.Y.Z / vX.Y.Z       :X.Y.Z          :sha-<short>
#   other branches           :sha-<short>
#   pull request             nothing (build and smoke test only)
#
# A kit consumer passes `artifact` (the pyproject.toml + uv.lock resolve-worker locked) and `worker-revision` /
# `worker-ref`: the image is built from that lock and labelled sk.stuba.elvira.evilflowers-worker.{revision,ref},
# which worker-nightly.yml compares with the kit's master.
#
# The caller grants: contents: read, packages: write, id-token: write, attestations: write.

on:
  workflow_call:
    inputs:
      platforms:
        description: buildx platforms, comma-separated
        type: string
        default: linux/amd64
      build-args:
        description: Extra build args, one KEY=value per line (IMAGE_TAG=<ref>@<sha> is always added)
        type: string
        default: ""
      cache:
        description: gha | registry (:buildcache next to the image; works for multi-platform)
        type: string
        default: gha
      context:
        description: Build context
        type: string
        default: .
      file:
        description: Dockerfile path (default — <context>/Dockerfile)
        type: string
        default: ""
      prepare:
        description: Shell command run after checkout, before the build (e.g. export requirements.txt)
        type: string
        default: ""
      smoke-test:
        description: >-
          Shell command run against the image before the push. The image is loaded into the
          local daemon as $SMOKE_IMAGE, built for the first platform only.
        type: string
        default: ""
      artifact:
        description: >-
          Artifact of this run downloaded over the checkout before the build, e.g. the pyproject.toml + uv.lock
          resolve-worker locked and the tests ran against
        type: string
        default: ""
      artifact-path:
        description: Where the artifact is extracted, relative to the workspace
        type: string
        default: .
      worker-revision:
        description: evilflowers-worker commit (resolve-worker output `revision`); label + build arg EVILFLOWERS_WORKER_REVISION
        type: string
        default: ""
      worker-ref:
        description: evilflowers-worker ref (resolve-worker output `ref`); label
        type: string
        default: ""
    outputs:
      digest:
        description: Digest of the pushed image (sha256:…), empty on a pull request
        value: ${{ jobs.image.outputs.digest }}
      image:
        description: Image name without tag (ghcr.io/<owner>/<repo>)
        value: ${{ jobs.image.outputs.image }}
      tags:
        description: Tags pushed, one per line
        value: ${{ jobs.image.outputs.tags }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.vars.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The lock the tests ran against, over the committed one: the tested and the shipped kit commit are the same.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}

      - id: vars
        env:
          CACHE: ${{ inputs.cache }}
          PLATFORMS: ${{ inputs.platforms }}
          WORKER_REVISION: ${{ inputs.worker-revision }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$CACHE" in
            gha)
              from="type=gha"
              to="type=gha,mode=max" ;;
            registry)
              from="type=registry,ref=${image}:buildcache"
              to="type=registry,ref=${image}:buildcache,mode=max" ;;
            *)
              echo "::error::cache must be gha or registry, got '${CACHE}'"
              exit 1 ;;
          esac
          # A pull request pushes nothing, the registry cache included.
          [ "$PUSH" = true ] || [ "$CACHE" = gha ] || to=""
          # Build args after IMAGE_TAG: the kit commit, when given (EvilFlowersCatalog/evilflowers-worker#13).
          {
            echo "image=$image"
            echo "cache-from=$from"
            echo "cache-to=$to"
            echo "smoke-platform=${PLATFORMS%%,*}"
            echo "build-args<<EOF_BUILD_ARGS"
            echo "IMAGE_TAG=${GITHUB_REF_NAME}@${GITHUB_SHA}"
            if [ -n "$WORKER_REVISION" ]; then echo "EVILFLOWERS_WORKER_REVISION=${WORKER_REVISION}"; fi
            echo "EOF_BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: eval "$PREPARE"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(inputs.platforms, ',') || !contains(inputs.platforms, 'amd64')

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=match,pattern=^v?(\d+\.\d+\.\d+)$,group=1
            type=sha,prefix=sha-,format=short
          # Merged into the OCI labels; an empty line is dropped, so a service without the kit gets none.
          labels: |
            ${{ inputs.worker-revision != '' && format('sk.stuba.elvira.evilflowers-worker.revision={0}', inputs.worker-revision) || '' }}
            ${{ inputs.worker-ref != '' && format('sk.stuba.elvira.evilflowers-worker.ref={0}', inputs.worker-ref) || '' }}

      # Build once into the local daemon and prove the image works before anything is pushed.
      # load cannot hold a multi-platform image, hence the first platform only; the push below
      # reuses its layers from the cache.
      - name: Build for the smoke test
        if: inputs.smoke-test != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ steps.vars.outputs.smoke-platform }}
          load: true
          tags: smoke.local/image:${{ github.sha }}
          build-args: |
            ${{ steps.vars.outputs.build-args }}
            ${{ inputs.build-args }}
          cache-from: ${{ steps.vars.outputs.cache-from }}
          cache-to: ${{ steps.vars.outputs.cache-to }}

      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          SMOKE_IMAGE: smoke.local/image:${{ github.sha }}
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: eval "$SMOKE_TEST"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.vars.outputs.build-args }}
            ${{ inputs.build-args }}
          cache-from: ${{ steps.vars.outputs.cache-from }}
          cache-to: ${{ steps.vars.outputs.cache-to }}
          provenance: ${{ env.PUSH == 'true' }}
          sbom: ${{ env.PUSH == 'true' }}

      - name: Attest
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          WORKER_REVISION: ${{ inputs.worker-revision }}
          WORKER_REF: ${{ inputs.worker-ref }}
        run: |
          {
            if [ "$PUSH" = true ]; then echo "### Image pushed"; else echo "### Image built (pull request: not pushed)"; fi
            echo
            echo "Digest \`${DIGEST:-—}\`"
            echo
            if [ -n "$WORKER_REVISION" ]; then
              echo "evilflowers-worker \`${WORKER_REF:-?}\` = \`${WORKER_REVISION}\`"
              echo
            fi
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
